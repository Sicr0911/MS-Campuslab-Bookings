server:
  port: 8082

spring:
  application:
    name: ms-campuslab-bookings

  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USERNAME:campuslab_bookings}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway, no Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Evita que baseline-on-migrate "consuma" V1__create_reservas_table.sql:
    # en un schema vacio, sin esto Flyway baselinea en la version 1 por
    # defecto (coincide con la primera migracion real) y la da por aplicada
    # sin ejecutarla. baselineVersion 0 deja V1 como la primera migracion
    # pendiente de verdad.
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # URL del Identity Provider (ej. ms-auth / Keycloak) que expone las claves publicas
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8080/realms/campuslab}

  # Broker externo donde se publican los eventos de cambio de estado de una
  # reserva (ver spring-kafka en el pom.xml).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:34.201.119.90:9092}

  # Cluster RabbitMQ self-hosted (infra/mq): bookings publica ahi los eventos
  # de cambio de estado de una reserva para que ms-campuslab-notify dispare
  # el email/ticket/voucher correspondiente. Credenciales de desarrollo local
  # (admin/admin_dev); en EC2 se sobrescriben via variables de entorno desde
  # un .env fuera de control de versiones.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin_dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # El healthcheck de Docker depende de /actuator/health devolviendo 200;
    # el indicador automatico de Kafka prueba conectividad real contra el
    # broker (externo, fuera de esta red) y lo tumbaria a DOWN si ese broker
    # no esta disponible en este momento, aunque la app en si funcione bien.
    kafka:
      enabled: false
    rabbit:
      enabled: false

# URL base del microservicio ms-campuslab-catalog, consultado por CatalogClient
# para verificar stock/cupo disponible antes de aprobar una reserva.
campuslab:
  services:
    catalog-base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.campuslab.bookings: INFO
    org.hibernate.SQL: WARN
